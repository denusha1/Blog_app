server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: blog-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blogapp}
    username: ${DATABASE_USERNAME:blogapp}
    password: ${DATABASE_PASSWORD:blogapp}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  posts:
    schedule-check-ms: ${POST_SCHEDULE_CHECK_MS:30000}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-before-deploy-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:3000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
